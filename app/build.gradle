plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp'
    id 'com.google.protobuf'
}

android {
    namespace 'com.android.launcher3'
    compileSdk 36

    defaultConfig {
        applicationId 'org.launcher3.universal'
        minSdk 31
        targetSdk 35
        versionCode 3
        versionName '0.2.1-android16-release-port-folderfix'
    }

    buildFeatures {
        buildConfig false
        aidl true
    }

    sourceSets {
        main {
            manifest.srcFile '../port/AndroidManifest.xml'
            java.srcDirs = [
                '../source/src',
                '../source/src_no_quickstep',
                '../source/src_build_config',
                '../source/src_plugins',
                '../source/shared/src',
                '../dependencies/iconloaderlib/src',
                '../port/src/main/java'
            ]
            res.srcDirs = ['../source/res', '../dependencies/iconloaderlib/res', '../port/src/main/res']
            proto.srcDirs = ['../source/protos', '../source/protos_overrides']
        }
    }

    signingConfigs {
        release {
            storeFile file('../release/launcher3-universal.keystore')
            storePassword 'changeit'
            keyAlias 'launcher3-universal'
            keyPassword 'changeit'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ['-Xjvm-default=all']
    }
}

protobuf {
    protoc {
        artifact = 'com.google.protobuf:protoc:4.28.3'
    }
    generateProtoTasks {
        all().configureEach { task ->
            task.builtins {
                java { option 'lite' }
            }
        }
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.fragment:fragment:1.8.6'
    implementation 'androidx.slice:slice-core:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.window:window:1.3.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.graphics:graphics-shapes:1.1.0'
    implementation 'androidx.customview:customview:1.2.0'
    implementation 'androidx.savedstate:savedstate:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.google.protobuf:protobuf-javalite:4.28.3'
    implementation 'com.google.dagger:dagger:2.52'
    ksp 'com.google.dagger:dagger-compiler:2.52'
}
